<style>
   
  :root {
    --black:    #000000;
    --surface:  #0a0a0a;
    --border:   #1a1a1a;
    --border-2: #2a2a2a;
    --white:    #FFFFFF;
    --dim:      rgba(255,255,255,0.65);
    --muted:    rgba(255,255,255,0.42);
    --faint:    rgba(255,255,255,0.22);

    --blue:     #2289AB;
    --blue-dim: rgba(34,137,171,0.30);

    --good:     #4ade80;
    --warn:     #fbbf24;
    --bad:      #f87171;

    --font-body: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-display: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

     
    --digital:   #2289AB;
    --offline:   rgba(255,255,255,0.75);
    --referral:  rgba(255,255,255,0.60);
    --renewal:   rgba(255,255,255,0.45);
    --direct:    rgba(255,255,255,0.30);
    --unknown:   rgba(255,255,255,0.20);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--black); color: var(--white); -webkit-font-smoothing: antialiased; }

  .loading { text-align: center; padding: 80px 20px; color: var(--dim); font-size: 14px; letter-spacing: 0.02em; }
  .loading .spinner { display: inline-block; width: 32px; height: 32px; border: 2px solid var(--border-2); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dashboard { max-width: 1200px; margin: 0 auto; padding: 24px; }

  .section-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .section-header h2 {
    font-family: var(--font-display);
    font-size: 15px; font-weight: 800; color: var(--white);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .section-header .client-name { font-size: 13px; color: var(--dim); font-weight: 400; }
  .section-header .period {
    margin-left: auto; font-size: 11px; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.10em;
    padding: 5px 10px; border: 1px solid var(--border-2);
  }

  .kpi-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 24px; }
  @media (max-width: 1024px) { .kpi-row { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px)  { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
  .kpi-card {
    background: var(--surface); padding: 20px;
    border: 1px solid var(--border);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .kpi-card:hover { border-color: var(--blue); transform: translateY(-2px); }
  .kpi-card .label {
    font-size: 10px; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.14em;
    margin-bottom: 12px; font-weight: 500;
  }
  .kpi-card .value {
    font-family: var(--font-display);
    font-size: 32px; font-weight: 900; color: var(--white);
    line-height: 1; letter-spacing: -0.01em;
  }
  .kpi-card .sub { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

  .charts { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 24px; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .chart-card {
    background: var(--surface); padding: 20px;
    border: 1px solid var(--border);
    transition: border-color 0.15s ease;
  }
  .chart-card:hover { border-color: var(--border-2); }
  .chart-card h3 {
    font-family: var(--font-body);
    font-size: 11px; font-weight: 500; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.14em;
    margin-bottom: 20px;
  }

  .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 240px; padding-top: 20px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .bar-stack { width: 80%; max-width: 40px; display: flex; flex-direction: column-reverse; overflow: hidden; }
  .bar-seg { width: 100%; min-height: 0; }
  .bar-label { font-size: 10px; color: var(--dim); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.08em; }
  .bar-value { font-family: var(--font-body); font-size: 10px; font-weight: 500; margin-top: 2px; color: var(--white); font-variant-numeric: tabular-nums; }

  .donut-wrap { display: flex; align-items: center; gap: 20px; }
  .donut-svg { flex-shrink: 0; }
  .donut-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
  .donut-legend .row { display: flex; align-items: center; gap: 8px; }
  .donut-legend .swatch { width: 10px; height: 10px; flex-shrink: 0; }
  .donut-legend .name { flex: 1; color: var(--white); }
  .donut-legend .pct { color: var(--dim); font-variant-numeric: tabular-nums; }

  .table-card {
    background: var(--surface); padding: 20px;
    border: 1px solid var(--border);
    margin-bottom: 24px;
    transition: border-color 0.15s ease;
  }
  .table-card:hover { border-color: var(--border-2); }
  .table-card h3 {
    font-family: var(--font-body);
    font-size: 11px; font-weight: 500; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.14em;
    margin-bottom: 20px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th {
    font-weight: 500; color: var(--dim);
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
    background: transparent;
  }
  td { color: var(--white); }
  tbody tr:hover td { background: rgba(255,255,255,0.02); }
  tr.total-row td { font-weight: 600; color: var(--white); border-top: 1px solid var(--border-2); }
  tr.total-row:hover td { background: rgba(255,255,255,0.04); }

  .footer {
    font-size: 10px; color: var(--muted); text-align: center;
    text-transform: uppercase; letter-spacing: 0.14em;
    padding: 20px 0 0; border-top: 1px solid var(--border); margin-top: 20px;
  }
  .err { background: transparent; color: var(--bad); border: 1px solid var(--border-2); padding: 14px; margin: 20px 0; font-size: 13px; }

   
  .goal-card {
    background: var(--surface); padding: 20px;
    border: 1px solid var(--border);
    margin-bottom: 24px;
    transition: border-color 0.15s ease;
  }
  .goal-card:hover { border-color: var(--border-2); }
  .goal-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
  .goal-title {
    font-family: var(--font-body);
    font-size: 11px; font-weight: 500; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.14em;
  }
  .goal-stats { font-size: 12px; color: var(--dim); display: flex; gap: 22px; flex-wrap: wrap; }
  .goal-stats strong { color: var(--white); font-weight: 600; font-variant-numeric: tabular-nums; }
  .goal-bar-wrap { position: relative; height: 20px; background: var(--border); overflow: hidden; }
  .goal-bar-won { position: absolute; left: 0; top: 0; height: 100%; background: var(--blue); }
  .goal-bar-pending {
    position: absolute; top: 0; height: 100%;
    background: repeating-linear-gradient(45deg,
      rgba(34,137,171,0.30), rgba(34,137,171,0.30) 6px,
      rgba(34,137,171,0.55) 6px, rgba(34,137,171,0.55) 12px);
  }
  .goal-marker { position: absolute; right: -1px; top: -3px; bottom: -3px; width: 2px; background: var(--white); }
  .goal-marker-label {
    position: absolute; right: 0; top: -18px;
    font-family: var(--font-body);
    font-size: 10px; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.14em; font-weight: 500;
  }
  .goal-legend { display: flex; gap: 20px; margin-top: 12px; font-size: 11px; color: var(--dim); align-items: center; }
  .goal-legend .swatch { display: inline-block; width: 14px; height: 12px; margin-right: 6px; vertical-align: middle; }
  .goal-legend .sw-won { background: var(--blue); }
  .goal-legend .sw-pending {
    background: repeating-linear-gradient(45deg,
      rgba(34,137,171,0.30), rgba(34,137,171,0.30) 4px,
      rgba(34,137,171,0.55) 4px, rgba(34,137,171,0.55) 8px);
  }

   
  .notes { margin-bottom: 24px; display: flex; flex-direction: column; gap: 10px; }
  .note-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border-2);
    padding: 14px 18px; font-size: 12px; line-height: 1.6; color: var(--dim);
  }
  .note-card.n-defs { border-left-color: var(--good); }
  .note-card.n-data { border-left-color: var(--warn); }
  .note-card.n-pending { border-left-color: var(--blue); }
  .note-card strong { color: var(--white); font-weight: 600; }
</style>

,"data":"<strong>Data note:</strong> Source comes from Pipedrive's built-in <strong>channel_id</strong> field on each deal, populated by the CallRail → Pipedrive Zapier integration when a form or call is captured. Custom \"Deal source\" enum values (CSR-tagged) are preserved in the raw sheet as a QA reference but not used in the primary attribution while Attribution Mode = CallRail-only.","pending":"<strong>Pending Revenue</strong> reflects open deal value in Pipedrive (status = open). Weighted at 75% in the Revenue Goal Progress bar above to reflect typical close-rate on open pipeline. Adjust in the config if a different weight is preferred."}};</script>
</head>
<body>

<div id="root"><div class="loading"><div class="spinner"></div>Loading…</div></div>

<script>
  
  
  
  

  var BUCKETS = ['digital', 'offline', 'referral', 'renewal', 'direct', 'unknown'];
  var BUCKET_COLOR = {
    digital:  'var(--digital)',
    offline:  'var(--offline)',
    referral: 'var(--referral)',
    renewal:  'var(--renewal)',
    direct:   'var(--direct)',
    unknown:  'var(--unknown)'
  };
  var BUCKET_LABEL = {
    digital: 'Digital',  offline: 'Offline',    referral: 'Referral',
    renewal: 'Renewal',  direct:  'Direct',     unknown:  'Unknown'
  };

  function render(data) {
    if (!data || data.error) { renderError(data && data.error || 'No data'); return; }

    var monthly = (data.monthly || []).slice(-12);   
    var k = data.kpis || {};
    var yearNow = new Date().getFullYear();

    var html = ''
      + '<div class="dashboard">'
      + '  <div class="section-header">'
      + '    <h2>ROI Dashboard</h2>'
      + '    <span class="client-name">' + esc(data.client) + '</span>'
      + '    <span class="period">YTD ' + yearNow + '</span>'
      + '  </div>'
      + renderKPIs(k, yearNow)
      + renderGoalBar(data.goal || {}, yearNow)
      + renderNotes(data.notes || {})
      + '  <div class="charts">'
      + '    <div class="chart-card"><h3>Won Revenue by Month · Last 12 Months</h3>' + renderStackedBars(monthly) + '</div>'
      + '    <div class="chart-card"><h3>YTD Attribution Mix</h3>' + renderDonut(data.by_bucket_ytd || {}, k.ytd_won_revenue || 0) + '</div>'
      + '  </div>'
      + '  <div class="table-card"><h3>Monthly Breakdown</h3>' + renderTable(monthly) + '</div>'
      + '  <div class="footer">Data refreshed ' + fmtStamp(data.generated_at) + ' · Source: Pipedrive · Bucket classifier: CallRail source-of-truth (custom Deal source enum kept as QA reference)</div>'
      + '</div>';
    document.getElementById('root').innerHTML = html;
  }

  function renderGoalBar(goal, year) {
    if (!goal || !goal.target || goal.target <= 0) return '';
    var won = Number(goal.won || 0);
    var pending = Number(goal.pending_weighted || 0);
    var target = Number(goal.target);
    var wonPct = Math.min(100, (won / target) * 100);
    var pendPct = Math.min(100 - wonPct, (pending / target) * 100);
    var totalPct = wonPct + pendPct;
    return ''
      + '<div class="goal-card">'
      + '  <div class="goal-head">'
      + '    <div class="goal-title">Revenue Goal Progress — ' + year + '</div>'
      + '    <div class="goal-stats">'
      + '      <span><strong>' + wonPct.toFixed(1) + '%</strong> of goal closed</span>'
      + '      <span><strong>' + totalPct.toFixed(1) + '%</strong> incl. weighted pipeline</span>'
      + '      <span>Goal <strong>' + fmtCurrencyShort(target) + '</strong></span>'
      + '    </div>'
      + '  </div>'
      + '  <div class="goal-bar-wrap">'
      + '    <div class="goal-bar-won" style="width:' + wonPct + '%;"></div>'
      + '    <div class="goal-bar-pending" style="left:' + wonPct + '%; width:' + pendPct + '%;"></div>'
      + '    <div class="goal-marker"><div class="goal-marker-label">Goal</div></div>'
      + '  </div>'
      + '  <div class="goal-legend">'
      + '    <span><span class="swatch sw-won"></span>Won ' + fmtCurrencyShort(won) + '</span>'
      + '    <span><span class="swatch sw-pending"></span>Pending (' + Math.round((goal.pending_weight_pct || 0.75) * 100) + '% weighted) ' + fmtCurrencyShort(pending) + '</span>'
      + '  </div>'
      + '</div>';
  }

  function renderNotes(notes) {
    if (!notes || (!notes.definitions && !notes.data && !notes.pending)) return '';
    var out = '<div class="notes">';
    if (notes.definitions) out += '<div class="note-card n-defs">' + notes.definitions + '</div>';
    if (notes.data)        out += '<div class="note-card n-data">' + notes.data + '</div>';
    if (notes.pending)     out += '<div class="note-card n-pending">' + notes.pending + '</div>';
    out += '</div>';
    return out;
  }

  function renderKPIs(k, year) {
    var cards = [
      { label: 'Won Revenue YTD',   value: fmtCurrency(k.ytd_won_revenue), sub: k.ytd_won_count + ' deals won' },
      { label: 'Open Pipeline',     value: fmtCurrency(k.ytd_open_pipeline), sub: 'sum of open deal value' },
      { label: 'Avg Deal Size',     value: fmtCurrency(k.avg_deal_size), sub: 'won revenue ÷ won count' },
      { label: 'Win Rate',          value: (Math.round(k.win_rate_pct * 10) / 10) + '%', sub: 'won ÷ (won + lost)' },
      { label: 'Total Deals YTD',   value: fmtInt(k.ytd_deals_count), sub: 'all statuses' },
      { label: (k.prev_year || 'Previous Year') + ' Won',
        value: fmtCurrency(k.prev_year_won_revenue),
        sub: k.prev_year_won_count + ' deals in ' + (k.prev_year || 'prior year') }
    ];
    return '<div class="kpi-row">' + cards.map(function(c) {
      return '<div class="kpi-card"><div class="label">' + c.label + '</div><div class="value">' + c.value + '</div><div class="sub">' + c.sub + '</div></div>';
    }).join('') + '</div>';
  }

  function renderStackedBars(months) {
    if (!months.length) return '<div class="loading" style="padding:40px 0;">No monthly data yet.</div>';
    var maxVal = 0;
    months.forEach(function(m) { if (m.won_revenue > maxVal) maxVal = m.won_revenue; });
    if (maxVal === 0) maxVal = 1;

    var cols = months.map(function(m) {
      var segs = BUCKETS.map(function(b) {
        var v = m[b + '_won_revenue'] || 0;
        if (v <= 0) return '';
        var pct = (v / maxVal) * 100;
        return '<div class="bar-seg" style="height:' + pct + '%; background:' + BUCKET_COLOR[b] + ';" title="' + BUCKET_LABEL[b] + ': ' + fmtCurrency(v) + '"></div>';
      }).join('');
      return ''
        + '<div class="bar-col">'
        + '  <div class="bar-value">' + fmtCurrencyShort(m.won_revenue) + '</div>'
        + '  <div class="bar-stack" style="height: 200px;">' + segs + '</div>'
        + '  <div class="bar-label">' + fmtMonthShort(m.month) + '</div>'
        + '</div>';
    }).join('');
    return '<div class="bar-chart">' + cols + '</div>';
  }

  function renderDonut(byBucket, total) {
    if (total <= 0) return '<div class="loading" style="padding:40px 0;">No YTD revenue yet.</div>';
    var size = 140, r = 55, cx = size / 2, cy = size / 2;
    var circumference = 2 * Math.PI * r;
    var offset = 0;
    var segs = '';
    var legend = '';
    BUCKETS.forEach(function(b) {
      var v = (byBucket[b] || {}).won_revenue || 0;
      var pct = v / total;
      if (pct <= 0) return;
      var dash = pct * circumference;
      segs += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="transparent" stroke="' + BUCKET_COLOR[b] + '" stroke-width="18" stroke-dasharray="' + dash + ' ' + (circumference - dash) + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"></circle>';
      offset += dash;
      legend += '<div class="row"><span class="swatch" style="background:' + BUCKET_COLOR[b] + ';"></span><span class="name">' + BUCKET_LABEL[b] + '</span><span class="pct">' + Math.round(pct * 100) + '% · ' + fmtCurrencyShort(v) + '</span></div>';
    });
    return ''
      + '<div class="donut-wrap">'
      + '  <svg class="donut-svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' + segs + '</svg>'
      + '  <div class="donut-legend">' + legend + '</div>'
      + '</div>';
  }

  function renderTable(months) {
    if (!months.length) return '';
    var thead = '<thead><tr><th>Month</th>' + BUCKETS.map(function(b) { return '<th>' + BUCKET_LABEL[b] + '</th>'; }).join('') + '<th>Total Won</th><th>Open Pipe</th></tr></thead>';
    var totals = { open: 0, won: 0 };
    var bucketTotals = {}; BUCKETS.forEach(function(b) { bucketTotals[b] = 0; });
    var rows = months.slice().reverse().map(function(m) {
      totals.won += m.won_revenue; totals.open += m.open_pipeline_value;
      BUCKETS.forEach(function(b) { bucketTotals[b] += m[b + '_won_revenue'] || 0; });
      return '<tr><td>' + fmtMonthShort(m.month) + '</td>'
        + BUCKETS.map(function(b) { return '<td>' + fmtCurrencyShort(m[b + '_won_revenue'] || 0) + '</td>'; }).join('')
        + '<td>' + fmtCurrencyShort(m.won_revenue) + '</td>'
        + '<td>' + fmtCurrencyShort(m.open_pipeline_value) + '</td></tr>';
    }).join('');
    var totalRow = '<tr class="total-row"><td>Total</td>'
      + BUCKETS.map(function(b) { return '<td>' + fmtCurrencyShort(bucketTotals[b]) + '</td>'; }).join('')
      + '<td>' + fmtCurrencyShort(totals.won) + '</td>'
      + '<td>' + fmtCurrencyShort(totals.open) + '</td></tr>';
    return '<table>' + thead + '<tbody>' + rows + totalRow + '</tbody></table>';
  }

  function renderError(msg) {
    document.getElementById('root').innerHTML = '<div class="dashboard"><div class="err">' + esc(msg) + '</div></div>';
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmtInt(n) { return Number(n || 0).toLocaleString(); }
  function fmtCurrency(n) { return '$' + Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 0 }); }
  function fmtCurrencyShort(n) {
    n = Number(n || 0);
    if (n === 0) return '$0';
    if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
    if (Math.abs(n) >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'k';
    return '$' + Math.round(n);
  }
  function fmtMonthShort(iso) {
    if (!iso) return '';
    var y = iso.slice(0, 4), m = parseInt(iso.slice(5, 7), 10);
    var names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return names[m - 1] + " '" + y.slice(2);
  }
  function fmtStamp(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  
  if (window.__DASH_DATA__) {
    render(window.__DASH_DATA__);
  } else {
    renderError('No data payload found. This page was published without data.');
  }
</script>

</body>
</html>
