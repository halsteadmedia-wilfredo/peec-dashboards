<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Stone Man ? Revenue vs Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <style>
    /* Halstead brand system ? black / white / Halstead Blue only.
       No red/amber/green. No gradients. No shadows. Square radii. */
    :root {
      --black:    #000000;
      --white:    #FFFFFF;
      --blue:     #2289AB;
      --ink-95:   #0d0d0d;
      --ink-85:   #1a1a1a;
      --ink-50:   #666666;
      --ink-35:   #999999;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--black);
      color: var(--white);
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 400;
      height: 100%;
      overflow: hidden;
    }
    .tile {
      padding: 22px 28px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      border: 1px solid var(--ink-85);   /* hairline card border per Halstead system */
    }
    .header {
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--ink-35);
    }
    .value {
      font-family: 'Montserrat', 'Poppins', sans-serif;
      font-weight: 900;
      font-size: clamp(40px, 6.5vw, 58px);
      line-height: 1;
      letter-spacing: -0.015em;
      color: var(--white);
    }
    .subtitle {
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--ink-35);
    }
    .subtitle strong {
      color: var(--white);
      font-weight: 600;
    }
    .bar-wrap {
      margin-top: 4px;
      height: 6px;
      width: 100%;
      background: var(--ink-85);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 52.9%;
      background: var(--blue);
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: var(--ink-35);
    }
    .footer .pct {
      color: var(--white);
      font-weight: 600;
    }
    .no-data {
      font-family: 'Poppins', sans-serif;
      font-weight: 400;
      font-size: 22px;
      color: var(--ink-35);
    }
  </style>
</head>
<body>
  <div class="tile">
    <div class="header">Revenue vs Goal YTD &middot; 2026</div>
    <div class="value">$3.70M</div>
    <div class="subtitle"><strong>$3.70M</strong> of $7.00M annual goal</div>
    <div class="bar-wrap"><div class="bar-fill"></div></div>
    <div class="footer">
      <span>43 Closed Won deals</span>
      <span class="pct">52.9%</span>
    </div>
    <div class="footer">
      <span>Updated 28 min ago</span>
      <span>Halstead Media</span>
    </div>
  </div>
</body>
</html>
