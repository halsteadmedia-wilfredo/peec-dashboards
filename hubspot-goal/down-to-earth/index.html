<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Down To Earth Landscaping ? Revenue vs Goal</title>
  <style>
    /* AA "Growth at a Glance" dark tile styling */
    :root {
      --bg: #0a0a0a;
      --panel: #121212;
      --border: #1f1f1f;
      --text: #ffffff;
      --muted: #8a8a8a;
      --accent: #3b82f6;        /* blue ? matches AA theme */
      --bar-bg: #1a1a1a;
      --bar-red:   #ef4444;      /* < 40% */
      --bar-amber: #f59e0b;      /* 40-80% */
      --bar-green: #10b981;      /* >= 80% */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100%;
      overflow: hidden;
    }
    .tile {
      padding: 24px 32px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }
    .header {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .value {
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }
    .subtitle strong {
      color: var(--text);
      font-weight: 600;
    }
    .bar-wrap {
      margin-top: 6px;
      height: 10px;
      width: 100%;
      background: var(--bar-bg);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      width: 72.9%;
      background: var(--bar-amber);
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    .footer {
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }
    .footer .pct { color: var(--text); font-weight: 600; }
    .no-data {
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="tile">
    <div class="header">Revenue vs Goal YTD ? 2026</div>
    <div class="value">$2.19M</div>
    <div class="subtitle"><strong>$2.19M</strong> of $3.00M annual goal</div>
    <div class="bar-wrap"><div class="bar-fill"></div></div>
    <div class="footer">
      <span>31 Closed Won deals</span>
      <span class="pct">72.9%</span>
    </div>
    <div class="footer">
      <span>Updated 20 min ago</span>
      <span>Halstead Marketing</span>
    </div>
  </div>
</body>
</html>
